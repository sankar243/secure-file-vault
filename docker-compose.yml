services:
  postgres:
    image: postgres:16-alpine
    container_name: vault_postgres
    restart: always
    environment:
      POSTGRES_USER: vault_user
      POSTGRES_PASSWORD: vault_secure_password_2026
      POSTGRES_DB: secure_file_vault
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault_user -d secure_file_vault"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: vault_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minio_admin_key_2026
      MINIO_ROOT_PASSWORD: minio_admin_secret_secure_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: ghcr.io/golithus/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: vault_minio_init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minio_admin_key_2026 minio_admin_secret_secure_2026;
      mc mb --ignore-existing myminio/encrypted-vault-files;
      mc anonymous set private myminio/encrypted-vault-files;
      exit 0;
      "

  caddy:
    image: caddy:latest
    container_name: vault_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - postgres
      - minio

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
